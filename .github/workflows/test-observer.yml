name: Test Beacon Observer

on:
  workflow_dispatch:

jobs:
  observer:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Show package.json
        run: |
          echo "=== package.json ==="
          cat package.json

      - name: Install dependencies
        run: npm install

      - name: Verify tsx
        run: |
          npm list tsx
          npx tsx --version

      - name: Run Observer
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: npm run test:observer
