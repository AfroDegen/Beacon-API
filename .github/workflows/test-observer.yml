name: Test Beacon Observer

on:
  workflow_dispatch:

jobs:
  observer:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Display Node Version
        run: |
          node --version
          npm --version

      - name: Install Dependencies
        run: npm install

      - name: Debug package.json
        run: |
          echo "===== package.json ====="
          cat package.json
          echo "========================"

      - name: Check Files
        run: |
          echo "===== Repository Files ====="
          find . -type f
          echo "============================"

      - name: Verify tsx Installation
        run: |
          npm list tsx
          npx tsx --version

      - name: Run Observer
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: npm run test:observer
