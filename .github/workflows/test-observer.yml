name: Test Beacon Observer

on:
  workflow_dispatch:

jobs:
  observer:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: npm install

      - name: Run Observer
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: npm run test:observer
